<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <meta name="description" content="Latest headlines from hundreds of news sources" />
        <meta name="theme-color" content="#17181c" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📰%3C/text%3E%3C/svg%3E"
        />
        <title>News Portal</title>
    </head>
    <body>
        <header class="header">
            <div class="header__inner">
                <h1 class="header__title">News Portal</h1>
                <p class="header__subtitle">Choose a source to read the latest headlines</p>
            </div>
        </header>

        <main class="main">
            <section class="section" aria-labelledby="sources-title">
                <h2 class="section__title" id="sources-title">Sources</h2>
                <div class="sources" role="group" aria-labelledby="sources-title"></div>
            </section>

            <section class="section" aria-labelledby="news-title">
                <h2 class="section__title" id="news-title">Latest news</h2>
                <div class="news"></div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer__inner">
                <a class="footer__link" href="https://github.com/Khabib1802" target="_blank" rel="noopener noreferrer">
                    GitHub: Khabib1802
                </a>
                <p class="footer__copyright">
                    © 2026 · Data from
                    <a href="https://newsapi.org" target="_blank" rel="noopener noreferrer">NewsAPI</a>
                </p>
                <a
                    class="footer__logo"
                    href="https://rs.school/courses/javascript"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                        alt="RS School JavaScript course"
                        width="120"
                        height="40"
                    />
                </a>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <img class="news__meta-photo" alt="" loading="lazy" />
                </div>
                <div class="news__description">
                    <p class="news__description-source"></p>
                    <h3 class="news__description-title"></h3>
                    <p class="news__description-content"></p>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                    <a class="news__read-more" href="#" target="_blank" rel="noopener noreferrer">Read more</a>
                </div>
            </article>
        </template>
    </body>
</html>
